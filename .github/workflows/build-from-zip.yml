name: Build APK from ZIP

# Распаковывает .zip из репозитория прямо на GitHub и собирает APK.
# Запускается при пуше .zip или этого файла, а также вручную (Run workflow).
on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "В корне репозитория нет .zip файла"; exit 1; fi
          echo "Распаковываю: $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP/src"
          SETTINGS=$(find "$RUNNER_TEMP/src" -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then echo "settings.gradle не найден в архиве"; exit 1; fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Patch cryptography version (prebuilt Android wheel)
        run: |
          sed -i "s/cryptography==46.0.5/cryptography==42.0.8/" "$PROJECT_DIR/app/build.gradle"
          grep -n "cryptography" "$PROJECT_DIR/app/build.gradle"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -r | head -n 1)
          echo "sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager не найден"; ls -la "$SDK" "$SDK/cmdline-tools"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
